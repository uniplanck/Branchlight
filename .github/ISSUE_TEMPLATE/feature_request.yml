name: Feature request
description: Propose a focused Branchlight improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What Finder/Git workflow is unnecessarily slow, fragmented, or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful Branchlight behavior that would solve it.
    validations:
      required: true
  - type: textarea
    id: finder
    attributes:
      label: Finder-native angle
      description: If relevant, explain why this belongs in Finder, the companion app, or both.
  - type: textarea
    id: safety
    attributes:
      label: Git safety / edge cases
      description: Mention destructive behavior, dirty worktrees, detached HEAD, worktrees, remotes, or other important Git state.
