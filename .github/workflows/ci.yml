name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Verify Xcode project source coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          roots = [
              Path("BranchlightCore"),
              Path("BranchlightHost"),
              Path("BranchlightFinderExtension"),
              Path("BranchlightCoreTests"),
          ]
          project = Path("Branchlight.xcodeproj/project.pbxproj").read_text()
          sources = sorted(
              path
              for root in roots
              for path in root.rglob("*.swift")
              if path.is_file()
          )

          by_name = {}
          for source in sources:
              by_name.setdefault(source.name, []).append(source)

          duplicates = {
              name: paths
              for name, paths in by_name.items()
              if len(paths) > 1
          }
          if duplicates:
              print("Duplicate Swift basenames make explicit project coverage ambiguous:")
              for name, paths in sorted(duplicates.items()):
                  print(f"  {name}: " + ", ".join(map(str, paths)))
              sys.exit(1)

          missing = [
              source
              for source in sources
              if f"path = {source.name};" not in project
          ]
          if missing:
              print("Swift sources missing from Branchlight.xcodeproj:")
              for source in missing:
                  print(f"  {source}")
              print("Update the checked-in Xcode project before merging.")
              sys.exit(1)

          print(f"Verified {len(sources)} Swift source files are represented in Branchlight.xcodeproj")
          PY

      - name: Verify runtime security boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          finder_forbidden = {
              "Process(": "Finder must not spawn subprocesses",
              "URLSession": "Finder must not perform network requests",
              "URLRequest": "Finder must not perform network requests",
              "import Security": "Finder must not own credentials",
              "SecItem": "Finder must not access Keychain credentials",
              "api.github.com": "Finder must not call GitHub APIs",
              "github.com/login": "Finder must not own OAuth flows",
          }
          core_forbidden = {
              "import Security": "Core must not own Keychain credentials",
              "SecItem": "Core must not access Keychain credentials",
              "kSecClass": "Core must not access Keychain credentials",
              "oauth-token": "Core must not persist OAuth credentials",
          }

          violations = []
          for path in Path("BranchlightFinderExtension").rglob("*.swift"):
              text = path.read_text()
              for needle, reason in finder_forbidden.items():
                  if needle in text:
                      violations.append(f"{path}: {reason} ({needle!r})")

          for path in Path("BranchlightCore").rglob("*.swift"):
              text = path.read_text()
              for needle, reason in core_forbidden.items():
                  if needle in text:
                      violations.append(f"{path}: {reason} ({needle!r})")

          if violations:
              print("Runtime security boundary violations:")
              for violation in violations:
                  print(f"  {violation}")
              sys.exit(1)

          print("Finder subprocess/network/credential boundary and Core Keychain boundary verified")
          PY

      - name: Test Branchlight
        run: |
          xcodebuild \
            -project Branchlight.xcodeproj \
            -scheme Branchlight \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Build optimized Release product
        run: |
          xcodebuild \
            -project Branchlight.xcodeproj \
            -scheme Branchlight \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BranchlightRelease" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify Release bundle structure and metadata
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BranchlightRelease/Build/Products/Release/Branchlight.app"
          EXTENSION="$APP/Contents/PlugIns/BranchlightFinderExtension.appex"
          FRAMEWORK="$APP/Contents/Frameworks/BranchlightCore.framework"

          test -d "$APP"
          test -x "$APP/Contents/MacOS/Branchlight"
          test -d "$EXTENSION"
          test -x "$EXTENSION/Contents/MacOS/BranchlightFinderExtension"
          test -d "$FRAMEWORK"
          test -f "$FRAMEWORK/BranchlightCore"

          HOST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          HOST_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          EXT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXTENSION/Contents/Info.plist")
          EXT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXTENSION/Contents/Info.plist")
          EXT_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXTENSION/Contents/Info.plist")

          test "$HOST_VERSION" = "$EXT_VERSION"
          test "$HOST_BUILD" = "$EXT_BUILD"
          test "$EXT_POINT" = 'com.apple.FinderSync'
          test "$HOST_VERSION" = '0.1.0'
          test "$HOST_BUILD" = '1'

          echo "Release bundle verified: Branchlight $HOST_VERSION ($HOST_BUILD) + Finder Sync extension"
