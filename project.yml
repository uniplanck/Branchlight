name: Branchlight
options:
  bundleIdPrefix: com.uniplanck
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "13.0"

configFiles:
  Debug: Config/Branchlight.xcconfig
  Release: Config/Branchlight.xcconfig

targets:
  BranchlightCore:
    type: framework
    platform: macOS
    sources:
      - path: BranchlightCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight.Core
        PRODUCT_NAME: BranchlightCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Branchlight:
    type: application
    platform: macOS
    sources:
      - path: BranchlightHost
    info:
      path: BranchlightHost/Info.plist
      properties:
        CFBundleDisplayName: Branchlight
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSPrincipalClass: NSApplication
        BranchlightGitHubClientID: $(BRANCHLIGHT_GITHUB_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight
        PRODUCT_NAME: Branchlight
        CODE_SIGN_ENTITLEMENTS: BranchlightHost/BranchlightHost.entitlements
        REGISTER_APP_GROUPS: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: BranchlightCore
      - target: BranchlightFinderExtension
        embed: true
      - target: BranchlightGitService

  BranchlightFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: BranchlightFinderExtension
    info:
      path: BranchlightFinderExtension/Info.plist
      properties:
        CFBundleDisplayName: Branchlight Finder Extension
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight.Extension
        PRODUCT_NAME: BranchlightFinderExtension
        CODE_SIGN_ENTITLEMENTS: BranchlightFinderExtension/BranchlightFinderExtension.entitlements
        REGISTER_APP_GROUPS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: BranchlightCore

  BranchlightGitService:
    type: xpc-service
    platform: macOS
    sources:
      - path: BranchlightXPC
    info:
      path: BranchlightXPC/Info.plist
      properties:
        CFBundleDisplayName: Branchlight Git Service
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight.GitService
        PRODUCT_NAME: BranchlightGitService
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - target: BranchlightCore
        embed: true

  BranchlightCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BranchlightCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight.CoreTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BranchlightCore

  BranchlightXPCIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BranchlightXPCIntegrationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniplanck.Branchlight.XPCIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Branchlight.app/Contents/MacOS/Branchlight
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Branchlight
      - target: BranchlightCore

schemes:
  Branchlight:
    build:
      targets:
        Branchlight: all
        BranchlightCoreTests: [test]
        BranchlightXPCIntegrationTests: [test]
    test:
      targets:
        - BranchlightCoreTests
        - BranchlightXPCIntegrationTests
